name: firecrawl

x-common-service: &common-service
  # NOTE: If you don't want to build the service locally,
  # comment out the build: statement and uncomment the image: statement
  # image: ghcr.io/firecrawl/firecrawl
  build: apps/api

  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  networks:
    - backend
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

x-common-env: &common-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  REDIS_RATE_LIMIT_URL: ${REDIS_RATE_LIMIT_URL:-${REDIS_URL:-redis://redis:6379}}
  PLAYWRIGHT_MICROSERVICE_URL: ${PLAYWRIGHT_MICROSERVICE_URL:-http://playwright-service:3000/scrape}
  HTML_TO_MARKDOWN_SERVICE_URL: ${HTML_TO_MARKDOWN_SERVICE_URL:-http://go-html-to-md-service:8080}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_HOST: ${POSTGRES_HOST:-nuq-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-false}
  NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-8}
  CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-10}
  MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-5}
  BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-5}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL}
  MODEL_NAME: ${MODEL_NAME}
  MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
  AUTUMN_SECRET_KEY: ${AUTUMN_SECRET_KEY}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
  BULL_AUTH_KEY: ${BULL_AUTH_KEY}
  TEST_API_KEY: ${TEST_API_KEY}
  SUPABASE_ANON_TOKEN: ${SUPABASE_ANON_TOKEN}
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_SERVICE_TOKEN: ${SUPABASE_SERVICE_TOKEN}
  SELF_HOSTED_WEBHOOK_URL: ${SELF_HOSTED_WEBHOOK_URL}
  LOGGING_LEVEL: ${LOGGING_LEVEL}
  PROXY_SERVER: ${PROXY_SERVER}
  PROXY_USERNAME: ${PROXY_USERNAME}
  PROXY_PASSWORD: ${PROXY_PASSWORD}
  SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT}
  SEARXNG_ENGINES: ${SEARXNG_ENGINES}
  SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES}
  # Set NUQ_BACKEND=fdb to run the queue on FoundationDB instead of Postgres
  NUQ_BACKEND: ${NUQ_BACKEND}
  FDB_CLUSTER_FILE: ${NUQ_BACKEND:+/var/fdb/fdb.cluster}

services:
  playwright-service:
    # NOTE: If you don't want to build the service locally,
    # comment out the build: statement and uncomment the image: statement
    # image: ghcr.io/firecrawl/playwright-service:latest
    build: apps/playwright-service-ts
    environment:
      PORT: 3000
      PROXY_SERVER: ${PROXY_SERVER}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS}
      BLOCK_MEDIA: ${BLOCK_MEDIA}
      # Configure maximum concurrent pages for Playwright browser instances
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-10}
    networks:
      - backend
    ports:
      - "3001:3000"
    # Resource limits for Docker Compose (not Swarm)
    cpus: 2.0
    mem_limit: 4G
    memswap_limit: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g

  go-html-to-md-service:
    # NOTE: If you don't want to build the service locally,
    # comment out the build: statement and uncomment the image: statement
    # image: ghcr.io/firecrawl/go-html-to-md-service:latest
    build: apps/go-html-to-md-service
    environment:
      PORT: 8080
      ENV: ${ENV:-local}
    networks:
      - backend
    ports:
      - "8080:8080"
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
    #   interval: 30s
    #   timeout: 3s
    #   retries: 3
    #   start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    # Resource limits for Docker Compose (not Swarm)
    cpus: 1.0
    mem_limit: 512M
    memswap_limit: 512M

  api:
    <<: *common-service
    environment:
      <<: *common-env
      HOST: "0.0.0.0"
      PORT: ${INTERNAL_PORT:-3002}
      EXTRACT_WORKER_PORT: ${EXTRACT_WORKER_PORT:-3004}
      WORKER_PORT: ${WORKER_PORT:-3005}
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      HARNESS_STARTUP_TIMEOUT_MS: ${HARNESS_STARTUP_TIMEOUT_MS:-60000}
      ENV: local
      NUQ_WORKER_COUNT: 0
      NUM_WORKERS_PER_QUEUE: 1
    depends_on:
      redis:
        condition: service_started
      playwright-service:
        condition: service_started
      go-html-to-md-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "${PORT:-3002}:${INTERNAL_PORT:-3002}"
    volumes:
      - fdb-cluster-file:/var/fdb:ro
    command: node dist/src/harness.js --start-docker
    # Resource limits for Docker Compose (not Swarm)
    # Increase if you have more CPU cores/RAM available
    cpus: 4.0
    mem_limit: 8G
    memswap_limit: 8G

  turkish-financial-api:
    build:
      context: ./projects/turkish_financial
      target: runtime
    working_dir: /app
    env_file:
      - ./projects/turkish_financial/.env
    environment:
      FIRECRAWL_BASE_URL: http://api:3002
      DB_HOST: nuq-postgres
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      APP_DB_HOST: nuq-postgres
      APP_DB_PORT: 5432
      APP_DB_NAME: postgres
      APP_DB_USER: postgres
      APP_DB_PASSWORD: postgres
      DB_SCHEMA: turkish_financial
      SENTIMENT_PROVIDER: keyword
      FINANCIAL_CORS_ORIGINS: ${FINANCIAL_CORS_ORIGINS:-*}
      PYTHONUNBUFFERED: "1"
    depends_on:
      api:
        condition: service_started
      playwright-service:
        condition: service_started
      nuq-postgres:
        condition: service_started
    networks:
      - backend
    ports:
      - "${TURKISH_FINANCIAL_PORT:-8000}:8000"
    restart: unless-stopped
    volumes:
      - ./projects/turkish_financial:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/external/v1/health", timeout=5)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  turkish-financial-test:
    build:
      context: ./projects/turkish_financial
      target: test
    working_dir: /app
    env_file:
      - ./projects/turkish_financial/.env
    environment:
      FIRECRAWL_BASE_URL: http://api:3002
      DB_HOST: nuq-postgres
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      APP_DB_HOST: nuq-postgres
      APP_DB_PORT: 5432
      APP_DB_NAME: postgres
      APP_DB_USER: postgres
      APP_DB_PASSWORD: postgres
      DB_SCHEMA: turkish_financial
      SENTIMENT_PROVIDER: keyword
      PYTHONUNBUFFERED: "1"
    networks:
      - backend
    volumes:
      - ./projects/turkish_financial:/app
      - ./projects/getData_ff:/getData_ff:ro
    profiles:
      - tools

  academic-search-api:
    build:
      context: .
      dockerfile: projects/academic_search/Dockerfile
      target: runtime
    working_dir: /workspace/projects
    environment:
      FIRECRAWL_API_URL: http://api:3002
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      ACADEMIC_ENABLE_FIRECRAWL_RESEARCH: ${ACADEMIC_ENABLE_FIRECRAWL_RESEARCH:-false}
      ELSEVIER_API_KEY: ${ELSEVIER_API_KEY:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      CLARIVATE_API_KEY: ${CLARIVATE_API_KEY:-}
      ACADEMIC_CORS_ORIGINS: ${ACADEMIC_CORS_ORIGINS:-*}
      ACADEMIC_PROJECT_DB_PATH: /data/projects.db
      PYTHONPATH: /workspace/projects
      PYTHONUNBUFFERED: "1"
    depends_on:
      api:
        condition: service_started
    networks:
      - backend
    ports:
      - "${ACADEMIC_SEARCH_PORT:-8010}:8010"
    restart: unless-stopped
    volumes:
      - ./projects/academic_search:/workspace/projects/academic_search
      - academic-project-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8010/api/v1/health", timeout=5)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  academic-search-test:
    build:
      context: .
      dockerfile: projects/academic_search/Dockerfile
      target: test
    working_dir: /workspace/projects
    environment:
      FIRECRAWL_API_URL: http://api:3002
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      ACADEMIC_ENABLE_FIRECRAWL_RESEARCH: ${ACADEMIC_ENABLE_FIRECRAWL_RESEARCH:-false}
      ELSEVIER_API_KEY: ${ELSEVIER_API_KEY:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      CLARIVATE_API_KEY: ${CLARIVATE_API_KEY:-}
      PYTHONPATH: /workspace/projects
      PYTHONUNBUFFERED: "1"
    networks:
      - backend
    volumes:
      - ./projects/academic_search:/workspace/projects/academic_search
    profiles:
      - tools

  redis:
    # NOTE: If you want to use Valkey (open source) instead of Redis (source available),
    # uncomment the Valkey statement and comment out the Redis statement.
    # Using Valkey with Firecrawl is untested and not guaranteed to work. Use with caution.
    image: redis:alpine
    # image: valkey/valkey:alpine

    networks:
      - backend
    command: redis-server --bind 0.0.0.0
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

  rabbitmq:
    image: rabbitmq:3-management
    networks:
      - backend
    command: rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

  nuq-postgres:
    # NOTE: If you don't want to build the image locally,
    # comment out the build: statement and uncomment the image: statement
    # image: ghcr.io/firecrawl/nuq-postgres:latest
    build: apps/nuq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_INITDB_ARGS: "-c listen_addresses='*'"
    networks:
      - backend
    ports:
      - "5433:5432"
    command: 
      - "postgres"
      - "-c"
      - "listen_addresses=*"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # FoundationDB queue backend (experimental). Enable by setting
  # NUQ_BACKEND=fdb; the api container reads the shared cluster file from the
  # fdb-cluster-file volume. Replaces nuq-postgres once stable.
  foundationdb:
    image: foundationdb/foundationdb:7.3.63
    environment:
      FDB_NETWORKING_MODE: container
      FDB_COORDINATOR_PORT: 4500
    networks:
      - backend
    volumes:
      - fdb-data:/var/fdb/data
      - fdb-cluster-file:/var/fdb
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # one-shot: creates the database on first boot (no-op afterwards)
  foundationdb-init:
    image: foundationdb/foundationdb:7.3.63
    depends_on:
      - foundationdb
    entrypoint:
      - /bin/bash
      - -c
      - "sleep 5 && out=$(fdbcli -C /var/fdb/fdb.cluster --exec 'configure new single ssd' 2>&1); status=$$?; printf '%s\n' \"$$out\"; if [ \"$$status\" -eq 0 ]; then exit 0; fi; printf '%s\n' \"$$out\" | grep -Eiq 'already.*configured|database.*configured'"
    volumes:
      - fdb-cluster-file:/var/fdb
    networks:
      - backend
    restart: "no"

networks:
  backend:
    driver: bridge

volumes:
  fdb-data:
  fdb-cluster-file:
  academic-project-data:
