apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl-api
  namespace: firecrawl
  labels:
    app: firecrawl-api
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: firecrawl-api
  template:
    metadata:
      labels:
        app: firecrawl-api
        component: api
    spec:
      containers:
      - name: api
        image: ghcr.io/firecrawl/firecrawl:latest
        ports:
        - containerPort: 3002
          name: http
        - containerPort: 8000
          name: fastapi
        envFrom:
        - configMapRef:
            name: firecrawl-config
        - secretRef:
            name: firecrawl-secrets
        command: ["node", "dist/src/harness.js", "--start-docker"]
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z nuq-postgres 5432; do echo waiting for postgres; sleep 2; done;']
      - name: wait-for-redis
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z redis 6379; do echo waiting for redis; sleep 2; done;']
      - name: wait-for-rabbitmq
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done;']
      - name: wait-for-playwright
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z playwright-service 3000; do echo waiting for playwright-service; sleep 2; done;']
      - name: wait-for-go-html-md
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z go-html-to-md-service 8080; do echo waiting for go-html-to-md-service; sleep 2; done;']
---
apiVersion: v1
kind: Service
metadata:
  name: firecrawl-api
  namespace: firecrawl
  labels:
    app: firecrawl-api
    component: api
spec:
  type: ClusterIP
  ports:
  - port: 3002
    targetPort: 3002
    protocol: TCP
    name: http
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: fastapi
  selector:
    app: firecrawl-api