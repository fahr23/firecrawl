apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-html-to-md-service
  namespace: firecrawl
  labels:
    app: go-html-to-md-service
    component: converter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-html-to-md-service
  template:
    metadata:
      labels:
        app: go-html-to-md-service
        component: converter
    spec:
      containers:
      - name: go-html-to-md-service
        image: ghcr.io/firecrawl/go-html-to-md-service:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: ENV
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: go-html-to-md-service
  namespace: firecrawl
  labels:
    app: go-html-to-md-service
    component: converter
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: go-html-to-md-service