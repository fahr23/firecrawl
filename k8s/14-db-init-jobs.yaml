apiVersion: batch/v1
kind: Job
metadata:
  name: turkish-financial-db-init
  namespace: firecrawl
spec:
  template:
    metadata:
      name: turkish-financial-db-init
    spec:
      containers:
      - name: turkish-financial-db-init
        image: postgres:17
        envFrom:
        - configMapRef:
            name: firecrawl-config
        - secretRef:
            name: firecrawl-secrets
        env:
        - name: PGHOST
          value: "nuq-postgres"
        - name: PGPORT
          value: "5432"
        - name: PGUSER
          value: "postgres"
        - name: PGPASSWORD
          value: "postgres"
        - name: FINANCIAL_DB_NAME
          value: "turkish_financial"
        command:
        - /bin/sh
        - -ec
        - |
          until pg_isready -d postgres; do sleep 1; done
          if ! psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$$FINANCIAL_DB_NAME'" | grep -q 1; then
            createdb "$$FINANCIAL_DB_NAME"
            pg_dump -d postgres -n turkish_financial | psql -d "$$FINANCIAL_DB_NAME"
          fi
      restartPolicy: OnFailure
