apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: firecrawl-dev

namePrefix: dev-

bases:
- ../../

patchesStrategicMerge:
- replica-patch.yaml
- resource-patch.yaml

configMapGenerator:
- name: firecrawl-dev-config
  literals:
  - ENV=development
  - LOGGING_LEVEL=debug
  - NUM_WORKERS_PER_QUEUE=2
  - CRAWL_CONCURRENT_REQUESTS=5
  - MAX_CONCURRENT_JOBS=2
  - BROWSER_POOL_SIZE=2

images:
- name: ghcr.io/firecrawl/firecrawl
  newTag: dev
- name: ghcr.io/firecrawl/playwright-service
  newTag: dev
- name: ghcr.io/firecrawl/go-html-to-md-service
  newTag: dev