apiVersion: v1
kind: ConfigMap
metadata:
  name: firecrawl-config
  namespace: firecrawl
data:
  # Database configuration
  POSTGRES_HOST: "nuq-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "postgres"
  POSTGRES_USER: "postgres"
  USE_DB_AUTHENTICATION: "false"
  
  # Redis configuration
  REDIS_URL: "redis://redis:6379"
  REDIS_RATE_LIMIT_URL: "redis://redis:6379"
  
  # Service URLs. Fully qualified on purpose: Firecrawl's HTTP agents resolve hosts
  # with cacheable-lookup (dns.resolve4), which ignores the pod's search domains, so a
  # bare name reaches the upstream resolver and can get a router's catch-all answer.
  # Overlays use another namespace and name prefix, so they must override both URLs.
  PLAYWRIGHT_MICROSERVICE_URL: "http://playwright-service.firecrawl.svc.cluster.local:3000/scrape"
  HTML_TO_MARKDOWN_SERVICE_URL: "http://go-html-to-md-service.firecrawl.svc.cluster.local:8080"
  
  # RabbitMQ
  NUQ_RABBITMQ_URL: "amqp://rabbitmq:5672"
  
  # Worker configuration
  NUM_WORKERS_PER_QUEUE: "8"
  CRAWL_CONCURRENT_REQUESTS: "10"
  MAX_CONCURRENT_JOBS: "5"
  BROWSER_POOL_SIZE: "5"
  
  # API configuration
  HOST: "0.0.0.0"
  INTERNAL_PORT: "3002"
  EXTRACT_WORKER_PORT: "3004"
  WORKER_PORT: "3005"
  ENV: "production"
  # The harness starts this many queue workers in each API pod. There is no
  # separate nuq-worker deployment, so 0 leaves crawls and batch jobs unprocessed.
  NUQ_WORKER_COUNT: "1"
  # Measure memory and CPU against this pod's limits, not the whole node.
  IS_KUBERNETES: "true"
  HARNESS_STARTUP_TIMEOUT_MS: "60000"
  
  # Logging
  LOGGING_LEVEL: "info"