apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: firecrawl-ingress
  namespace: firecrawl
  labels:
    app: firecrawl
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    # -------------------------------------------------------------------------
    # NEW PROJECT DOMAINS: 
    # To expose a new workspace locally, append its '.localhost' hostname here 
    # to register it for TLS/Ingress tracking. Using '.localhost' ensures macOS 
    # automatically routes traffic locally without needing /etc/hosts changes.
    # -------------------------------------------------------------------------
    - firecrawl.localhost
    - api.localhost
    - academic.localhost
    secretName: firecrawl-tls
  rules:
  # ---------------------------------------------------------------------------
  # INGRESS ROUTING RULES:
  # When adding a new work package or project to the Kubernetes cluster,
  # append a new rule block below. Map the new '.localhost' hostname to
  # the backend service name and port you defined in your deployment manifest.
  # Note: Access all these locally via http://[domain].localhost:32080 
  # ---------------------------------------------------------------------------
  - host: firecrawl.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: firecrawl-api
            port:
              number: 3002
  - host: api.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: firecrawl-api
            port:
              number: 8000
  - host: academic.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: academic-search-api
            port:
              number: 8010
---
# Optional: NodePort service for testing without ingress
apiVersion: v1
kind: Service
metadata:
  name: firecrawl-api-nodeport
  namespace: firecrawl
  labels:
    app: firecrawl-api
    type: nodeport
spec:
  type: NodePort
  ports:
  - port: 3002
    targetPort: 3002
    nodePort: 30002
    protocol: TCP
    name: http
  - port: 8000
    targetPort: 8000
    nodePort: 30000
    protocol: TCP
    name: fastapi
  selector:
    app: firecrawl-api
