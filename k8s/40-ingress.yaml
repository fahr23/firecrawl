apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: firecrawl-ingress
  namespace: firecrawl
  labels:
    app: firecrawl
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - firecrawl.local
    secretName: firecrawl-tls
  rules:
  - host: firecrawl.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: firecrawl-api
            port:
              number: 3002
  - host: api.firecrawl.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: firecrawl-api
            port:
              number: 8000
---
# Optional: NodePort service for testing without ingress
apiVersion: v1
kind: Service
metadata:
  name: firecrawl-api-nodeport
  namespace: firecrawl
  labels:
    app: firecrawl-api
    type: nodeport
spec:
  type: NodePort
  ports:
  - port: 3002
    targetPort: 3002
    nodePort: 30002
    protocol: TCP
    name: http
  - port: 8000
    targetPort: 8000
    nodePort: 30000
    protocol: TCP
    name: fastapi
  selector:
    app: firecrawl-api