apiVersion: apps/v1
kind: Deployment
metadata:
  name: turkish-financial-api
  namespace: firecrawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: turkish-financial-api
  template:
    metadata:
      labels:
        app: turkish-financial-api
    spec:
      containers:
      - name: turkish-financial-api
        image: firecrawl-turkish-financial-api:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: firecrawl-env-config
        - configMapRef:
            name: firecrawl-config
        - secretRef:
            name: firecrawl-secrets
        env:
        - name: FIRECRAWL_BASE_URL
          value: "http://firecrawl-api:3002"
        - name: DB_HOST
          value: "nuq-postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "turkish_financial"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"
        - name: APP_DB_HOST
          value: "nuq-postgres"
        - name: APP_DB_PORT
          value: "5432"
        - name: APP_DB_NAME
          value: "turkish_financial"
        - name: APP_DB_USER
          value: "postgres"
        - name: APP_DB_PASSWORD
          value: "postgres"
        - name: DB_SCHEMA
          value: "turkish_financial"
        - name: BIST_CATALOG_PATH
          value: "/data/bist_tum.csv"
        - name: SENTIMENT_PROVIDER
          value: "keyword"
        - name: YOUTUBE_CHANNELS
          value: "https://www.youtube.com/@bistyatirimcipsikolojisi/videos,https://www.youtube.com/@kanalfinans/videos,https://www.youtube.com/channel/UCIju0kyYHAqQePXdGFjhLdA/videos,https://www.youtube.com/@GedikYatirim/videos,https://www.youtube.com/@ZiraatYatirim/videos,https://www.youtube.com/@MeseleEkonomi/videos,https://www.youtube.com/@EkoTurkTV/videos,https://www.youtube.com/@infoyatirim/videos,https://www.youtube.com/@TacirlerYatirimMenkulDegerler/videos,https://www.youtube.com/@A1Capital/videos"
        - name: PYTHONUNBUFFERED
          value: "1"
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: bist-catalog
          mountPath: /data/bist_tum.csv
          subPath: BIST_TUM.csv
      volumes:
      - name: bist-catalog
        configMap:
          name: bist-catalog
---
apiVersion: v1
kind: Service
metadata:
  name: turkish-financial-api
  namespace: firecrawl
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
  selector:
    app: turkish-financial-api
