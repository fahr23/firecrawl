apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-service
  namespace: firecrawl
  labels:
    app: playwright-service
    component: scraper
spec:
  replicas: 2
  selector:
    matchLabels:
      app: playwright-service
  template:
    metadata:
      labels:
        app: playwright-service
        component: scraper
    spec:
      containers:
      - name: playwright-service
        image: ghcr.io/firecrawl/playwright-service:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: PROXY_SERVER
          valueFrom:
            secretKeyRef:
              name: firecrawl-secrets
              key: PROXY_SERVER
              optional: true
        - name: PROXY_USERNAME
          valueFrom:
            secretKeyRef:
              name: firecrawl-secrets
              key: PROXY_USERNAME
              optional: true
        - name: PROXY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: firecrawl-secrets
              key: PROXY_PASSWORD
              optional: true
        - name: ALLOW_LOCAL_WEBHOOKS
          value: "false"
        - name: BLOCK_MEDIA
          value: "true"
        - name: MAX_CONCURRENT_PAGES
          value: "10"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: tmp-cache
          mountPath: /tmp/.cache
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
      volumes:
      - name: tmp-cache
        emptyDir:
          sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: playwright-service
  namespace: firecrawl
  labels:
    app: playwright-service
    component: scraper
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: playwright-service