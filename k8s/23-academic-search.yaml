apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: academic-project-data
  namespace: firecrawl
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: academic-search-api
  namespace: firecrawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: academic-search-api
  template:
    metadata:
      labels:
        app: academic-search-api
    spec:
      containers:
      - name: academic-search-api
        image: firecrawl-academic-search-api:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: firecrawl-env-config
        - configMapRef:
            name: firecrawl-config
        - secretRef:
            name: firecrawl-secrets
        env:
        - name: FIRECRAWL_API_URL
          value: "http://firecrawl-api:3002"
        - name: ACADEMIC_ENABLE_FIRECRAWL_RESEARCH
          value: "false"
        - name: ACADEMIC_PROJECT_DB_PATH
          value: "/data/projects.db"
        - name: PYTHONPATH
          value: "/workspace/projects"
        - name: PYTHONUNBUFFERED
          value: "1"
        ports:
        - containerPort: 8010
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: academic-project-data
---
apiVersion: v1
kind: Service
metadata:
  name: academic-search-api
  namespace: firecrawl
spec:
  type: NodePort
  ports:
  - port: 8010
    targetPort: 8010
    nodePort: 30081
  selector:
    app: academic-search-api
