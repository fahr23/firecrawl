apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: academic-search
spec:
  ingressClassName: nginx
  rules:
  - host: academic.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: academic-search-api
            port:
              number: 8010
