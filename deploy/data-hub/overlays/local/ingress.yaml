apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: data-hub
spec:
  ingressClassName: nginx
  rules:
  - host: data-hub.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: data-hub-api
            port:
              number: 8000
